<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Главная страница</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: #fff;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            max-width: 700px;
            width: 100%;
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 30px;
            font-size: 28px;
        }

        .tasks-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(100px, 1fr));
            gap: 12px;
        }

        .task-btn {
            display: block;
            text-align: center;
            padding: 18px 10px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: #fff;
            text-decoration: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .task-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 15px rgba(102, 126, 234, 0.5);
        }

        .task-btn:active {
            transform: translateY(0);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📚 Задания</h1>
        <div class="tasks-grid">
            <a href="ПР 1\index.html" class="task-btn">Задание 1</a>
            <a href="task2.html" class="task-btn">Задание 2</a>
            <a href="task3.html" class="task-btn">Задание 3</a>
            <a href="task4.html" class="task-btn">Задание 4</a>
            <a href="task5.html" class="task-btn">Задание 5</a>
            <a href="task6.html" class="task-btn">Задание 6</a>
            <a href="task7.html" class="task-btn">Задание 7</a>
            <a href="task8.html" class="task-btn">Задание 8</a>
            <a href="task9.html" class="task-btn">Задание 9</a>
            <a href="task10.html" class="task-btn">Задание 10</a>
            <a href="task11.html" class="task-btn">Задание 11</a>
            <a href="task12.html" class="task-btn">Задание 12</a>
            <a href="task13.html" class="task-btn">Задание 13</a>
            <a href="task14.html" class="task-btn">Задание 14</a>
        </div>
    </div>
</body>
</html>
